name: Deploy Portfolio Project
on:
  push:
    branches:
      - main
jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 🛠️ Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: 🔐 Create production .env
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME=UTBK
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US
          APP_MAINTENANCE_DRIVER=file
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          MAIL_MAILER=log
          MAIL_FROM_ADDRESS=hello@example.com
          MAIL_FROM_NAME=UTBK
          VITE_APP_NAME=UTBK
          ENVEOF

      - name: 🚀 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 600000
          server-dir: public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/.editorconfig
            **/.phpunit*
            **/phpunit.xml
            **/README.md
            **/Homestead.*
            **/.vscode/**
            **/.idea/**
            **/scratch/**

      - name: ⚡ Trigger post-deploy script on server
        run: |
          echo "Triggering deploy.php on server..."
          curl -f --max-time 120 "${{ secrets.APP_URL }}/deploy.php?token=${{ secrets.DEPLOY_TOKEN }}" || echo "Warning: deploy.php trigger failed or timed out"
